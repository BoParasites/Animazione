  .eyebrow { margin: 0; font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 0; font: italic 400 30px/1.05 var(--f-display); color: var(--ink); text-wrap: balance; }

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  const $ = id => document.getElementById(id);

  // ---------- RNG deterministico ----------
  let seed = 11;
  const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // ---------- Curve (Catmull-Rom campionata) ----------
  function makeCurve(pts, closed) {
    const n = pts.length, out = [], at = [];
    const P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
      const d = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const steps = Math.max(3, Math.ceil(d / 1.5));
      at.push(out.length);
      for (let j = 0; j < steps; j++) {
        const t = j / steps, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, e) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - e) * t2 + (-a + 3 * b - 3 * c + e) * t3);
        out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    at.push(out.length);
    out.push(closed ? out[0].slice() : pts[n - 1].slice());
    const cum = [0];
    for (let k = 1; k < out.length; k++) cum.push(cum[k - 1] + Math.hypot(out[k][0] - out[k - 1][0], out[k][1] - out[k - 1][1]));
    return { pts: out, at, cum, len: cum[cum.length - 1] };
  }
  function idxAt(c, s) { let lo = 0, hi = c.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c.cum[m] <= s) lo = m; else hi = m; } return lo; }
  function posAt(c, s) {
    s = clamp(s, 0, c.len); const k = idxAt(c, s), k2 = Math.min(k + 1, c.pts.length - 1);
    const seg = c.cum[k2] - c.cum[k], f = seg > 0 ? (s - c.cum[k]) / seg : 0;
    const a = c.pts[k], b = c.pts[k2];
    return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, a: Math.atan2(b[1] - a[1], b[0] - a[0]), k };
  }
  function polyPath(pts, k0 = 0, k1 = pts.length - 1, p = new Path2D()) {
    p.moveTo(pts[k0][0], pts[k0][1]); for (let k = k0 + 1; k <= k1; k++) p.lineTo(pts[k][0], pts[k][1]); return p;
  }
  function closedPath(pts) { const c = makeCurve(pts, true); const p = polyPath(c.pts); p.closePath(); return p; }

  // ---------- Anatomia (coordinate di scena, vista frontale) ----------
  const BOX = { x0: 84, y0: 16, x1: 772, y1: 918 };

    ['swallow',   [[304,158],[312,170],[316,200],[318,250],[320,305],[324,358],[336,395],[352,412],[372,428],[392,448],[398,478],[382,504],[354,518],[326,522],[310,530],[301,544],[304,558],[318,570],[338,568]]],
    ['adult',     [[360,574],[365,589],[350,600],[310,598],[270,596],[250,608],[262,624],[300,626],[340,624],[362,636],[356,652],[320,658],[280,655],[248,654]]],
    ['eggs',      [[236,652],[227,620],[226,580],[230,552],[244,538],[270,533],[300,535],[340,535],[376,533],[392,546],[396,582],[395,622],[391,654],[373,673],[340,676],[316,688],[304,708],[300,728],[300,745]]],

  const STAGES = [
    { k: 'ingest', title: 'Ingestione', time: 'giorno 0', dur: 4.5, glyph: 'eggE',

  const WP = [], startIdx = [];

  STAGES.forEach((st, i) => {

    st.t0 = T; T += st.dur;

  STAGES.forEach((st, i) => { st.s1 = i < STAGES.length - 1 ? STAGES[i + 1].s0 : route.len; });

  const coil = makeCurve(TUBES.coil, false);
  const soilStage = STAGES[9];
  const soilEggS = [];
  { const sA = route.cum[route.at[startIdx[9] + 3]];
    for (let s = sA; s < soilStage.s1 - 10; s += 26) soilEggS.push(s); }

  function locate(t) {
    t = ((t % T) + T) % T;
    let i = 0; while (i < STAGES.length - 1 && t >= STAGES[i + 1].t0) i++;
    const st = STAGES[i], u = clamp((t - st.t0) / st.dur, 0, 1);
    const e = st.ease === 'arrive' ? (u < 0.5 ? smooth(u / 0.5) : 1) : u;
    return { i, u, s: st.s0 + (st.s1 - st.s0) * e };
  }

  // ---------- Canvas ----------
  const cv = $('scene'), ctx = cv.getContext('2d');
  const cache = document.createElement('canvas'), cc = cache.getContext('2d');
  const tmp = document.createElement('canvas'), tc = tmp.getContext('2d');
  let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0, LW = 1;
  const wideMQ = matchMedia('(min-width: 760px)');

  function sceneT(c) { c.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY); }

  function layout() {
    W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
    for (const c of [cv, cache, tmp]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    const pr = $('panel').getBoundingClientRect();
    let rx1 = W, ry1 = H;
    if (wideMQ.matches) rx1 = pr.left - 8; else ry1 = pr.top - 4;
    const bw = BOX.x1 - BOX.x0, bh = BOX.y1 - BOX.y0, pad = 10;
    S = Math.max(0.1, Math.min((rx1 - 2 * pad) / bw, (ry1 - 2 * pad) / bh));
    OX = (rx1 - bw * S) / 2 - BOX.x0 * S;
    OY = (ry1 - bh * S) / 2 - BOX.y0 * S;
    LW = clamp(0.8 / S, 1, 1.7);
    buildCache();
    render();
  }

  const hsla = (h, s, l, a) => `hsla(${h},${s}%,${l}%,${a})`;

  function organ(c, pts, h, s, l, a = 1) {
    const p = closedPath(pts);
    c.save();
    c.globalCompositeOperation = 'screen';
    c.fillStyle = hsla(h, s, l, 0.11 * a); c.fill(p);
    c.save(); c.clip(p);
    c.lineWidth = 12; c.strokeStyle = hsla(h, s, l, 0.13 * a); c.stroke(p);
    c.lineWidth = 5; c.strokeStyle = hsla(h, s, l + 8, 0.12 * a); c.stroke(p);
    c.restore();
    c.lineWidth = 1.1 * LW; c.strokeStyle = hsla(h, s, l + 10, 0.55 * a); c.stroke(p);
    c.restore();
  }

  function tube(pts, w, h, s, l, a) {
    const p = polyPath(makeCurve(pts, false).pts);
    tc.setTransform(1, 0, 0, 1, 0, 0); tc.clearRect(0, 0, tmp.width, tmp.height);
    sceneT(tc); tc.lineCap = 'round'; tc.lineJoin = 'round';
    tc.globalCompositeOperation = 'source-over';
    tc.strokeStyle = hsla(h, s, l, 1); tc.lineWidth = w; tc.stroke(p);
    tc.globalCompositeOperation = 'destination-out';
    tc.strokeStyle = 'rgba(0,0,0,0.74)'; tc.lineWidth = Math.max(0.5, w - 1.5 * LW); tc.stroke(p);
    tc.globalCompositeOperation = 'source-over';
    tc.strokeStyle = hsla(h, s, l + 15, 0.10); tc.lineWidth = w * 0.3; tc.stroke(p);
    cc.save(); cc.setTransform(1, 0, 0, 1, 0, 0); cc.globalCompositeOperation = 'screen'; cc.globalAlpha = a;

  }

  function line(c, pts, w, col) {
    const p = polyPath(makeCurve(pts, false).pts);
    c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = w; c.strokeStyle = col; c.stroke(p);
  }

  function buildCache() {
    const c = cc;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#04060b'; c.fillRect(0, 0, cache.width, cache.height);
    sceneT(c);
    // alone diffuso dietro il corpo
    const halo = c.createRadialGradient(300, 430, 20, 300, 430, 520);
    halo.addColorStop(0, 'rgba(40,70,120,0.22)'); halo.addColorStop(1, 'rgba(4,6,11,0)');
    c.fillStyle = halo; c.fillRect(BOX.x0 - 400, BOX.y0 - 200, 1600, 1400);

    // suolo
    const gl = -OX / S - 20, gr = (W - OX) / S + 20;
    const gg = c.createLinearGradient(0, 846, 0, 940);
    gg.addColorStop(0, 'rgba(120,84,48,0.30)'); gg.addColorStop(1, 'rgba(50,34,20,0.04)');
    c.fillStyle = gg;
    c.beginPath(); c.moveTo(gl, 940);
    for (let x = gl; x <= gr; x += 8) c.lineTo(x, 848 + Math.sin(x * 0.031) * 2.2 + Math.sin(x * 0.11) * 0.8);
    c.lineTo(gr, 940); c.closePath(); c.fill();
    c.beginPath();
    for (let x = gl; x <= gr; x += 8) { const y = 848 + Math.sin(x * 0.031) * 2.2 + Math.sin(x * 0.11) * 0.8; x === gl ? c.moveTo(x, y) : c.lineTo(x, y); }
    c.lineWidth = LW; c.strokeStyle = 'rgba(205,160,105,0.35)'; c.stroke();
    seed = 11;
    for (let i = 0; i < 260; i++) {
      const x = gl + rnd() * (gr - gl), y = 854 + Math.pow(rnd(), 0.8) * 70, r = 0.6 + rnd() * 2.2;
      c.fillStyle = `rgba(${170 + rnd() * 60 | 0},${120 + rnd() * 50 | 0},${70 + rnd() * 40 | 0},${0.06 + rnd() * 0.16})`;
      c.beginPath(); c.ellipse(x, y, r * 1.3, r, rnd() * 3, 0, TAU); c.fill();
    }

    // corpo
    const body = closedPath(BODY);
    body.moveTo(350, 90); body.ellipse(300, 90, 50, 62, 0, 0, TAU);
    const bf = c.createLinearGradient(0, 30, 0, 860);
    bf.addColorStop(0, 'rgba(110,170,240,0.07)'); bf.addColorStop(0.7, 'rgba(110,170,240,0.05)'); bf.addColorStop(1, 'rgba(110,170,240,0)');
    c.fillStyle = bf; c.fill(body);
    c.save(); c.clip(body);
    const bs = c.createLinearGradient(0, 30, 0, 860);
    bs.addColorStop(0, 'rgba(130,190,255,0.20)'); bs.addColorStop(0.75, 'rgba(130,190,255,0.14)'); bs.addColorStop(1, 'rgba(130,190,255,0)');
    c.strokeStyle = bs; c.lineWidth = 16; c.stroke(body); c.lineWidth = 6; c.stroke(body);
    c.restore();
    const bl = c.createLinearGradient(0, 30, 0, 860);
    bl.addColorStop(0, 'rgba(160,205,255,0.60)'); bl.addColorStop(0.72, 'rgba(160,205,255,0.42)'); bl.addColorStop(1, 'rgba(160,205,255,0)');
    c.strokeStyle = bl; c.lineWidth = 1.2 * LW; c.stroke(body);

    // diaframma
    line(c, [[204,444],[240,422],[288,428],[300,434],[312,428],[360,420],[398,444]], 0.8 * LW, 'rgba(160,200,255,0.18)');

    // organi
    organ(c, ORGANS.lungR, 350, 70, 70);
    organ(c, ORGANS.lungL, 350, 70, 70);
    for (const b of BRONCHIOLES) line(c, b, 1.2 * LW, 'rgba(200,225,255,0.22)');
    organ(c, ORGANS.liver, 12, 65, 52);
    organ(c, ORGANS.stomach, 28, 70, 66);
    organ(c, ORGANS.heart, 356, 80, 60);
    for (const [x, y] of ALVEOLI) { c.beginPath(); c.arc(x, y, 3.6, 0, TAU); c.lineWidth = 0.8 * LW; c.strokeStyle = 'rgba(255,190,200,0.35)'; c.stroke(); }

    tube(TUBES.ivc, 7, 220, 70, 62, 0.55);
    tube(TUBES.portal, 5.5, 225, 70, 66, 0.6);
    tube(TUBES.hepatic, 4, 220, 70, 66, 0.5);
    tube(TUBES.pulmTrunk, 6, 265, 60, 70, 0.6);
    tube(TUBES.pulmL, 5, 265, 60, 70, 0.5);
    tube(TUBES.trachea, 11, 195, 50, 78, 0.7);
    tube(TUBES.bronchR, 6.5, 195, 50, 78, 0.6);
    tube(TUBES.bronchL, 6.5, 195, 50, 78, 0.6);
    tube(TUBES.esophagus, 13, 10, 55, 70, 0.6);
    tube(TUBES.colon, 21, 36, 45, 62, 0.62);
    tube(TUBES.appendix, 4, 36, 45, 62, 0.5);
    tube(TUBES.duodenum, 12, 340, 55, 74, 0.6);
    tube(TUBES.coil, 13, 340, 55, 74, 0.7);

    // anelli tracheali
    sceneT(c);
    for (let y = 176; y < 286; y += 8) { c.beginPath(); c.moveTo(291, y); c.quadraticCurveTo(296, y + 2, 301, y); c.lineWidth = 0.7 * LW; c.strokeStyle = 'rgba(200,235,255,0.28)'; c.stroke(); }

    // guida del percorso (sempre visibile, ininterrotta)
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.lineWidth = 0.9 * LW; c.strokeStyle = 'rgba(255,200,110,0.16)';
    c.stroke(routePath);
    c.restore();

    // etichette
    const fs = Math.max(9.5, 9.5 / S);
    c.font = `500 ${fs}px "Instrument Sans", system-ui, sans-serif`;
    c.textBaseline = 'middle';
    for (const [txt, x, y, al] of LABELS) {
      c.textAlign = al;
      c.fillStyle = 'rgba(200,215,240,0.46)';
      c.fillText(txt, x, y);
    }
  }
  const routePath = (() => { const p = polyPath(route.pts); p.closePath(); return p; })();

  // ---------- Glifi ----------
  function drawEgg(c, x, y, a, emb, fertile = true, sc = 1, alpha = 1) {
    c.save(); c.translate(x, y); c.rotate(a); c.scale(sc, sc); c.globalAlpha = alpha;
    c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(0, 0, 0, 0, 0, 16);
    g.addColorStop(0, 'rgba(255,190,90,0.30)'); g.addColorStop(1, 'rgba(255,190,90,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 16, 0, TAU); c.fill();
    c.globalCompositeOperation = 'source-over';
    if (fertile) {
      c.fillStyle = 'rgba(176,122,52,0.92)';
      c.beginPath(); c.ellipse(0, 0, 7.4, 6, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(206,150,72,0.95)';
      for (let i = 0; i < 22; i++) { const q = i / 22 * TAU; c.beginPath(); c.arc(Math.cos(q) * 7.2, Math.sin(q) * 5.8, 1.25, 0, TAU); c.fill(); }
      c.fillStyle = 'rgba(56,36,18,0.96)';
      c.beginPath(); c.ellipse(0, 0, 5.6, 4.4, 0, 0, TAU); c.fill();
      c.lineWidth = 0.5; c.strokeStyle = 'rgba(240,210,150,0.6)'; c.stroke();
      if (emb < 0.55) {
        const q = emb / 0.55, n = q < 0.25 ? 1 : q < 0.5 ? 2 : q < 0.75 ? 4 : 8;
        c.fillStyle = 'rgba(238,208,150,0.88)';
        const cells = n === 1 ? [[0, 0, 3.2]] : n === 2 ? [[-1.5, 0, 2.1], [1.5, 0, 2.1]]
          : n === 4 ? [[-1.4, -1.1, 1.5], [1.4, -1.1, 1.5], [-1.4, 1.1, 1.5], [1.4, 1.1, 1.5]]
          : Array.from({ length: 8 }, (_, i) => [Math.cos(i / 8 * TAU) * 2.4, Math.sin(i / 8 * TAU) * 1.7, 1.05]);
        for (const [cx, cy, r] of cells) { c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill(); }
      } else {
        c.globalAlpha = alpha * smooth((emb - 0.55) / 0.25);
        c.beginPath(); c.moveTo(-3.6, 1.2);
        c.bezierCurveTo(-3.9, -3.1, 3.9, -3.1, 3.7, 0);
        c.bezierCurveTo(3.5, 2.7, -1.9, 2.9, -1.7, 0.3);
        c.bezierCurveTo(-1.5, -1.3, 1.4, -1.3, 1.6, 0.3);
        c.lineCap = 'round'; c.lineWidth = 1; c.strokeStyle = 'rgba(255,238,205,0.95)'; c.stroke();
      }
    } else {
      c.fillStyle = 'rgba(160,112,50,0.85)';
      c.beginPath(); c.ellipse(0, 0, 8.8, 4.6, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(70,46,22,0.95)';
      c.beginPath(); c.ellipse(0, 0, 7.6, 3.5, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(215,180,120,0.75)';
      for (let i = 0; i < 11; i++) { c.beginPath(); c.arc(-6 + i * 1.2, Math.sin(i * 2.1) * 1.6, 0.75, 0, TAU); c.fill(); }
    }
    c.restore();
  }

  function drawLarva(c, x, y, a, len, ph, alpha = 1) {
    c.save(); c.translate(x, y); c.rotate(a); c.globalAlpha = alpha;
    const p = new Path2D();
    for (let i = 0; i <= 22; i++) {
      const f = i / 22, lx = -len + len * f, ly = 1.9 * Math.sin(f * TAU * 1.2 - ph) * (0.35 + 0.65 * (1 - f));
      i ? p.lineTo(lx, ly) : p.moveTo(lx, ly);
    }
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.globalCompositeOperation = 'lighter';
    c.lineWidth = 6 * LW; c.strokeStyle = 'rgba(255,215,140,0.16)'; c.stroke(p);
    c.lineWidth = 2.4 * LW; c.strokeStyle = 'rgba(255,240,215,0.95)'; c.stroke(p);
    c.restore();
  }

  function drawWorm(c, s0, len, maxW, male, phase, alpha, clock) {
    if (alpha <= 0.01) return;
    const N = Math.ceil(len / 2.5), P = [];
    for (let i = 0; i <= N; i++) {
      const f = i / N, p = posAt(coil, s0 + f * len);
      const nx = -Math.sin(p.a), ny = Math.cos(p.a);
      let off = 4.5 + 2.0 * Math.sin(f * len * 0.085 - clock * 1.6 + phase);
      if (male && f > 0.86) { const q = (f - 0.86) / 0.14; off += q * q * 10; }
      P.push([p.x + nx * off, p.y + ny * off, Math.max(0.7, maxW * Math.pow(Math.sin(Math.PI * f), 0.45))]);
    }
    c.save(); c.globalAlpha = alpha; c.lineCap = 'round';
    const pass = (extra, col) => {
      c.strokeStyle = col;
      for (let i = 0; i < N; i++) { c.lineWidth = P[i][2] + extra; c.beginPath(); c.moveTo(P[i][0], P[i][1]); c.lineTo(P[i + 1][0], P[i + 1][1]); c.stroke(); }
    };
    pass(2.2, 'rgba(70,28,30,0.85)');
    pass(0, 'rgba(246,176,170,0.95)');
    c.globalCompositeOperation = 'lighter';
    pass(-P[0][2] * 0.6 - 1.5, 'rgba(255,230,225,0.35)');
    c.restore();
  }

  // ---------- Stato ----------
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = reduced ? T - 0.001 : 0, clock = 0, ghost = 0, speed = 1, paused = reduced, last = null, curStage = -1;

  const GLOW = [[12, 'rgba(255,165,40,0.05)'], [7.5, 'rgba(255,178,50,0.09)'], [4.2, 'rgba(255,192,80,0.18)'], [2.3, 'rgba(255,212,120,0.60)'], [1, 'rgba(255,248,225,0.95)']];

  function strokeGlow(c, p, alpha) {
    c.globalAlpha = alpha;
    for (const [w, col] of GLOW) { c.lineWidth = w * LW; c.strokeStyle = col; c.stroke(p); }
    c.globalAlpha = 1;
  }

  function render() {
    const L = locate(t), st = STAGES[L.i], u = L.u, sH = L.s;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(cache, 0, 0);
    sceneT(ctx);

    // battito cardiaco
    const beat = Math.pow(Math.max(0, Math.sin(clock * 7.2)), 6);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const hg = ctx.createRadialGradient(312, 372, 2, 312, 372, 44);
    hg.addColorStop(0, `rgba(255,80,90,${0.06 + 0.12 * beat})`); hg.addColorStop(1, 'rgba(255,80,90,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(312, 372, 44, 0, TAU); ctx.fill();
    // alveoli attivi
    const alvA = st.k === 'lungs' ? smooth(u * 3) : st.k === 'ascent' ? 1 - smooth(u * 2) : 0;
    if (alvA > 0) for (const [x, y] of ALVEOLI) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, 7);
      g.addColorStop(0, `rgba(255,170,190,${0.45 * alvA})`); g.addColorStop(1, 'rgba(255,170,190,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 7, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // uova nel suolo
    const inSoil = L.i === 9, after = L.i === 10;
    soilEggS.forEach((s, j) => {
      let a = 0;
      if (inSoil) a = smooth((sH - s) / 8); else if (after) a = 1; else a = ghost;
      if (a <= 0.01) return;
      const p = posAt(route, s), side = (j % 2 ? 1 : -1) * (4 + (j * 7) % 5);
      const emb = inSoil ? smooth((u - 0.15) / 0.75) : 1;
      drawEgg(ctx, p.x - Math.sin(p.a) * side, p.y + Math.cos(p.a) * side, p.a + j * 0.9, emb, j !== 3, 1.15, a);
    });

    // percorso luminoso
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const head = posAt(route, sH);
    const lit = polyPath(route.pts, 0, head.k); lit.lineTo(head.x, head.y);
    strokeGlow(ctx, lit, 0.9 + 0.1 * Math.sin(clock * 2.4));
    if (ghost > 0.01) {
      const rest = new Path2D(); rest.moveTo(head.x, head.y);
      for (let k = head.k + 1; k < route.pts.length; k++) rest.lineTo(route.pts[k][0], route.pts[k][1]);
      strokeGlow(ctx, rest, ghost * 0.9);
    }
    // coda della cometa
    const kT = idxAt(route, Math.max(0, sH - 70));
    if (kT < head.k) {
      const tail = polyPath(route.pts, kT, head.k); tail.lineTo(head.x, head.y);
      ctx.lineWidth = 3.4 * LW; ctx.strokeStyle = 'rgba(255,245,215,0.45)'; ctx.stroke(tail);
    }
    // scintille che scorrono lungo la linea
    const NS = 52;
    for (let n = 0; n < NS; n++) {
      const s = (n / NS * route.len + clock * 46) % route.len;
      let a = s <= sH ? 1 : ghost;
      if (a <= 0.02) continue;
      a *= 0.55 + 0.45 * Math.sin(clock * 5 + n * 2.3);
      const p = posAt(route, s);
      ctx.fillStyle = `rgba(255,205,120,${0.14 * a})`; ctx.beginPath(); ctx.arc(p.x, p.y, 4.2 * LW, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,250,235,${0.9 * a})`; ctx.beginPath(); ctx.arc(p.x, p.y, 1.1 * LW, 0, TAU); ctx.fill();
    }
    // testa
    const hr = 20 * LW, g = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, hr);
    g.addColorStop(0, 'rgba(255,230,160,0.55)'); g.addColorStop(0.4, 'rgba(255,190,80,0.18)'); g.addColorStop(1, 'rgba(255,190,80,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(head.x, head.y, hr, 0, TAU); ctx.fill();
    ctx.restore();

    // vermi adulti nel digiuno
    const wA = L.i > 7 ? 1 : L.i === 7 ? smooth((u - 0.25) / 0.5) : ghost;
    const slide = Math.sin(clock * 0.35) * 10;
    drawWorm(ctx, coil.len * 0.10 + slide, coil.len * 0.27, 6.4, false, 0, wA, clock);
    drawWorm(ctx, coil.len * 0.50 - slide, coil.len * 0.21, 5.2, true, 1.7, wA, clock);

    // glifo del parassita
    const ph = clock * 9, sc = 1.35 * clamp(LW, 1, 1.4);
    switch (st.glyph) {
      case 'eggE': drawEgg(ctx, head.x, head.y, head.a, 1, true, sc); break;
      case 'hatch': {
        const fe = 1 - smooth((u - 0.35) / 0.2);
        if (fe > 0) drawEgg(ctx, head.x, head.y, head.a + Math.sin(clock * 14) * 0.15 * smooth(u / 0.35), 1, true, sc, fe);
        if (fe < 1) drawLarva(ctx, head.x, head.y, head.a, 16, ph, 1 - fe);
        break;
      }
      case 'larva': drawLarva(ctx, head.x, head.y, head.a, 16, ph); break;
      case 'grow': drawLarva(ctx, head.x, head.y, head.a, 16 + 26 * smooth(u), ph, 1 - smooth((u - 0.65) / 0.3)); break;
      case 'eggs':
        for (let j = 4; j >= 0; j--) {
          const s = sH - j * 11; if (s < st.s0) continue;
          const p = posAt(route, s); drawEgg(ctx, p.x, p.y, p.a + j, 0, true, 0.95 * sc, 1 - j * 0.12);
        }
        break;
      case 'eggSoil': drawEgg(ctx, head.x, head.y, head.a, smooth((u - 0.15) / 0.75), true, sc); break;
    }

    // pannello
    if (L.i !== curStage) setStage(L.i);
    $('prog').style.width = (((t % T) + T) % T / T * 100).toFixed(2) + '%';
  }

  // ---------- Pannello ----------
  const list = $('list');
  STAGES.forEach((st, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button type="button"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${st.title}</span><span class="d">${st.time}</span></button>`;
    li.firstChild.addEventListener('click', () => jump(i));
    list.appendChild(li);
  });
  function setStage(i) {
    curStage = i; const st = STAGES[i];
    $('nowNum').textContent = `${String(i + 1).padStart(2, '0')} / ${STAGES.length}`;
    $('nowTitle').textContent = st.title;
    $('nowText').textContent = st.text;
    $('nowTime').textContent = st.time; $('nowTime').hidden = !st.time;
    [...list.children].forEach((li, j) => { li.classList.toggle('active', j === i); li.classList.toggle('done', j < i); });
  }
  function jump(i) { i = (i + STAGES.length) % STAGES.length; t = STAGES[i].t0 + 0.001; ghost = 0; render(); }
  function setPaused(p) { paused = p; $('play').textContent = p ? '▶ Riproduci' : '❚❚ Pausa'; }
  $('play').addEventListener('click', () => setPaused(!paused));
  $('prev').addEventListener('click', () => { const L = locate(t); jump(L.u > 0.15 ? L.i : L.i - 1); });
  $('next').addEventListener('click', () => jump(locate(t).i + 1));
  document.querySelectorAll('.speed button').forEach(b => b.addEventListener('click', () => {
    speed = parseFloat(b.dataset.s);
    document.querySelectorAll('.speed button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  addEventListener('keydown', e => {
    if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); setPaused(!paused); }
    if (e.key === 'ArrowRight') jump(locate(t).i + 1);
    if (e.key === 'ArrowLeft') jump(locate(t).i - 1);
  });
  setPaused(paused);

  // ---------- Ciclo ----------
  function frame(now) {
    const dt = last == null ? 0 : Math.min(0.05, (now - last) / 1000); last = now;
    if (!paused) { t += dt * speed; if (t >= T) { t -= T; ghost = 1; } }
    clock += dt * (paused ? 0.3 : speed);
    ghost = Math.max(0, ghost - dt / 2.5);
    render();
    requestAnimationFrame(frame);
  }
  // render deterministico per esportazione video: window.renderAt(secondi)
  window.renderAt = sec => { paused = true; t = sec % T; clock = sec; ghost = sec >= T ? 0 : 0; render(); };
  window.CYCLE_SECONDS = T;

  addEventListener('resize', layout);
  wideMQ.addEventListener?.('change', layout);
  layout();
  document.fonts && document.fonts.ready.then(layout);
  requestAnimationFrame(frame);
})();
</script>
