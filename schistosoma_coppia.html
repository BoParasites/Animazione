<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coppia di Schistosoma mansoni</title>
<style>
  /* Scena a tutto schermo su nero, didascalia minima in basso a sinistra. Tema unico scuro (sfondo nero richiesto). */
  :root {
    --bg: #000000;
    --ink: rgba(236, 231, 222, 0.74);
    --ink-dim: rgba(236, 231, 222, 0.44);
    --font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    font: 12px/1.45 var(--font-ui); letter-spacing: .02em;
    pointer-events: none; user-select: none;
  }
  #hud .sp { font-style: italic; color: var(--ink); }
  #hud .note { color: var(--ink-dim); }
  #bar { height: 2px; width: 100px; background: var(--ink); margin: 0 0 4px; }
  #hint {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    font: 12px/1.45 var(--font-ui); color: var(--ink-dim); pointer-events: none; user-select: none;
  }
  #err { position: fixed; inset: 0; display: grid; place-items: center; font: 14px/1.5 var(--font-ui); color: var(--ink); padding-inline: max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
  .capture #hud, .capture #hint { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div id="bar"></div><span id="barlabel">1 mm</span><br>
  <span class="sp">Schistosoma mansoni</span> <span class="note">· maschio con la femmina nel canale ginecoforo</span>
</div>
<div id="hint">trascina per ruotare · rotella per zoom</div>
<div id="err" hidden></div>
<script type="module">
import * as THREE from 'three';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = new URLSearchParams(location.search);
const CAPTURE = params.has('capture');
if (CAPTURE) document.documentElement.classList.add('capture');
const REDUCED = !CAPTURE && matchMedia('(prefers-reduced-motion: reduce)').matches;
const num = (k, d) => (params.has(k) ? parseFloat(params.get(k)) : d);

// ---------------------------------------------------------------- utilità
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261128 >>> 0;
const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const srgb2lin = c => Math.pow(c / 255, 2.2);
const linRGB = (r, g, b) => new THREE.Color().setRGB(srgb2lin(r), srgb2lin(g), srgb2lin(b));
// campionamento più fitto alle estremità (punte arrotondate)
const warp = (x, k = 0.8) => x - k * Math.sin(TAU * x) / TAU;
// profilo per punti di controllo [t, v1, v2, ...], interpolazione cubica di Hermite
function makeProfile(pts) {
  const n = pts.length, dim = pts[0].length - 1;
  const tan = pts.map((p, k) => { const a = pts[Math.max(0, k - 1)], b = pts[Math.min(n - 1, k + 1)];
    return p.slice(1).map((_, d) => (b[d + 1] - a[d + 1]) / (b[0] - a[0])); });
  return (t, out) => {
    let k = 0; while (k < n - 2 && t > pts[k + 1][0]) k++;
    const h = pts[k + 1][0] - pts[k][0], u = clamp((t - pts[k][0]) / h, 0, 1), u2 = u * u, u3 = u2 * u;
    const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
    for (let d = 0; d < dim; d++) out[d] = h00 * pts[k][d + 1] + h10 * h * tan[k][d] + h01 * pts[k + 1][d + 1] + h11 * h * tan[k + 1][d];
    return out;
  };
}
// rumore 1D liscio (valore) per macchiettature
const NOISE = Array.from({ length: 1024 }, rnd);
const vnoise = x => { const i = Math.floor(x), f = x - i, a = NOISE[i & 1023], b = NOISE[(i + 1) & 1023];
  const s = f * f * (3 - 2 * f); return a + (b - a) * s; };

// ---------------------------------------------------------------- morfologia (mm, valori indicativi)
// Maschio ~10 mm, arrotolato con il lato ventrale (canale ginecoforo) verso l'interno, come negli
// esemplari al SEM; parte anteriore sollevata con ventosa orale terminale e ventosa ventrale a disco.
// Femmina ~12 mm, più sottile e liscia: la parte anteriore esce dal canale dietro la ventosa ventrale,
// la posteriore oltre la coda del maschio.
const L_M = 10.0;          // lunghezza maschio
const RHO_C = 0.265;       // raggio della linea media della lamina nel canale
const TH_C = 0.16;         // spessore lamina nel canale
const PHI_MEAN = 4.7;      // arrotolamento medio della lamina (rad)
const M_VS = 0.075;        // posizione ventosa ventrale (frazione della lunghezza)
const M_EXIT = 0.15;       // apertura anteriore del canale da cui esce la femmina
const LH = 0.9;            // parte anteriore libera della femmina (mm)
const M_MAX = 1.10;        // la spina prosegue oltre il maschio: coda libera della femmina (~1 mm)
const M_OS = 0.035;        // inizio della ventosa orale del maschio (frazione della lunghezza)
const S_OS = 0.06;         // lunghezza della ventosa orale della femmina (mm)
const NM = 820;            // nodi della spina
const DS = L_M * M_MAX / (NM - 1);

// ---------------------------------------------------------------- renderer
const W0 = parseInt(params.get('w') || '1920', 10), H0 = parseInt(params.get('h') || '1080', 10);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: !CAPTURE, preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance' });
} catch (e) {
  const el = document.getElementById('err'); el.hidden = false;
  el.textContent = 'Questo browser non riesce ad aprire WebGL, che serve per la scena 3D.';
  throw e;
}
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(window.devicePixelRatio || 1, 1.5));
renderer.toneMapping = params.get('tm') === 'agx' ? THREE.AgXToneMapping : THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = num('exp', 1.0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const SHADOWS = num('sh', 1) > 0;
renderer.shadowMap.enabled = SHADOWS;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(27, 16 / 9, 0.1, 100);

// ---------------------------------------------------------------- tre softbox virtuali
RectAreaLightUniformsLib.init();
const rig = new THREE.Group(); scene.add(rig);
function softbox(w, h, intensity, color, x, y, z) {
  const l = new THREE.RectAreaLight(color, intensity, w, h);
  l.position.set(x, y, z); l.lookAt(0, 0, 0); rig.add(l); return l;
}
// key: grande, in alto a sinistra davanti, neutro-caldo
const KEY_POS = new THREE.Vector3(-21, 14, 8);
const key = softbox(12, 16, num('key', 7.0), 0xfff1e2, KEY_POS.x, KEY_POS.y, KEY_POS.z);
// fill: ampio, a destra, più debole e leggermente freddo
const fill = softbox(24, 20, num('fill', 1.0), 0xe6eeff, 20, 0, 12);
// rim: strip box alta dietro il soggetto, disegna i contorni sul nero
const rim = softbox(5, 26, num('rim', 30.0), 0xffffff, 9, 11, -18);
// ombra morbida della key: le RectAreaLight non proiettano ombre, quindi una parte della key
// arriva da una luce direzionale nella stessa posizione con ombra sfumata (VSM)
const keyShadow = new THREE.DirectionalLight(0xfff1e2, SHADOWS ? num('keysh', 1.6) : 0);
keyShadow.position.copy(KEY_POS);
keyShadow.castShadow = SHADOWS;
{
  const s = keyShadow.shadow, c = s.camera;
  s.mapSize.set(2048, 2048); c.left = -4.5; c.right = 4.5; c.top = 4.5; c.bottom = -4.5; c.near = 10; c.far = 50;
  s.radius = 3; s.bias = -0.0004; s.normalBias = 0.006;
}
rig.add(keyShadow); scene.add(keyShadow.target);

// ---------------------------------------------------------------- texture del tegumento
// UV del maschio: u = posizione lungo il corpo (0 testa → 1 coda), v = posizione sul profilo della sezione:
// 0–0.15 e 0.85–1 superficie interna del canale, 0.2–0.8 superficie esterna (dorsale e laterale).
const V_OUT0 = 0.2, V_OUT1 = 0.8;
function dome(g, cx, cy, rx, ry, a) {
  g.save(); g.translate(cx, cy); g.scale(rx, ry);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(0.45, `rgba(255,255,255,${0.82 * a})`);
  gr.addColorStop(0.8, `rgba(255,255,255,${0.32 * a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 1, 0, TAU); g.fill(); g.restore();
}
function makeMaleTextures() {
  const TW = 4096, TH = 1024;
  const c = document.createElement('canvas'); c.width = TW; c.height = TH;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, TW, TH);
  g.globalCompositeOperation = 'lighter';
  const pxU = TW / L_M;
  const arcOut = (RHO_C + TH_C / 2) * PHI_MEAN, arcIn = (RHO_C - TH_C / 2) * PHI_MEAN;
  const pxV = (V_OUT1 - V_OUT0) * TH / arcOut, pxVin = 0.3 * TH / arcIn;
  const pxVfore = TH / 0.95;                    // collo: v = frazione della circonferenza (~0.95 mm)
  // tubercoli: cupole fitte su dorso e fianchi, fino ai margini del canale; piccoli subito dietro la ventosa ventrale
  const sp = 0.068;
  const tubs = [];
  let row = 0;
  for (let xm = 1.05; xm < 9.9; xm += sp * 0.866, row++) {
    const along = smooth(1.05, 2.0, xm) * smooth(9.9, 9.5, xm);
    for (let ym = (row & 1) * sp / 2; ym < arcOut; ym += sp) {
      const a = ym / arcOut;
      const fade = smooth(0.0, 0.06, a) * smooth(1.0, 0.94, a);
      const k = fade * (0.35 + 0.65 * along);
      if (k < 0.08) continue;
      const r = (0.016 + 0.009 * rnd()) * (0.5 + 0.5 * k);
      const cx = (xm + (rnd() - 0.5) * sp * 0.5) * pxU;
      const cy = (V_OUT0 + clamp(a + (rnd() - 0.5) * sp * 0.5 / arcOut, 0, 1) * (V_OUT1 - V_OUT0)) * TH;
      dome(g, cx, cy, r * pxU, r * pxV, 0.85 + 0.15 * rnd());
      tubs.push([cx, cy, r]);
    }
  }
  // papille e spine fini: collo, superficie interna del canale, margini
  const fine = (u0, u1, v0, v1, n, rmin, rmax, a, pv) => {
    for (let i = 0; i < n; i++) {
      const u = lerp(u0, u1, rnd()), v = lerp(v0, v1, rnd()), r = lerp(rmin, rmax, rnd());
      dome(g, u * pxU, v * TH, r * pxU, r * pv, a);
    }
  };
  fine(0.17, 1.1, 0.0, 1.0, 1600, 0.004, 0.007, 0.5, pxVfore);      // collo e parete esterna della ventosa orale
  // striature radiali sulle labbra della ventosa orale (u ≈ 0.06–0.16 mm)
  for (let k = 0; k < 90; k++) {
    const y = (k + 0.5 * rnd()) / 90 * TH, x0 = 0.055 * pxU, x1 = (0.15 + 0.02 * rnd()) * pxU;
    const gr = g.createLinearGradient(x0, 0, x1, 0);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.5)');
    gr.addColorStop(0.8, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(x0, y - 2.5, x1 - x0, 5);
  }
  fine(1.0, 9.9, 0.0, 0.15, 2600, 0.003, 0.006, 0.4, pxVin);         // interno del canale
  fine(1.0, 9.9, 0.85, 1.0, 2600, 0.003, 0.006, 0.4, pxVin);
  fine(1.0, 9.9, 0.15, 0.2, 900, 0.004, 0.007, 0.45, pxV);           // margini
  fine(1.0, 9.9, 0.8, 0.85, 900, 0.004, 0.007, 0.45, pxV);
  g.globalCompositeOperation = 'source-over';
  const bump = new THREE.CanvasTexture(c);
  bump.colorSpace = THREE.NoColorSpace;
  bump.wrapS = bump.wrapT = THREE.ClampToEdgeWrapping;
  bump.anisotropy = renderer.capabilities.getMaxAnisotropy();

  // mappa colore: tegumento arancio-salmone, apici dei tubercoli più chiari (crema), lievi variazioni di tono
  const c2 = document.createElement('canvas'); c2.width = TW; c2.height = TH;
  const g2 = c2.getContext('2d');
  g2.fillStyle = 'rgb(216,182,164)'; g2.fillRect(0, 0, TW, TH);
  for (let i = 0; i < 260; i++) {
    const x = rnd() * TW, y = rnd() * TH, r = 60 + 220 * rnd();
    const gr = g2.createRadialGradient(x, y, 0, x, y, r);
    const dark = rnd() < 0.5;
    gr.addColorStop(0, dark ? 'rgba(150,95,70,0.10)' : 'rgba(255,236,222,0.09)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g2.fillStyle = gr; g2.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  g2.globalCompositeOperation = 'screen'; g2.globalAlpha = 0.75; g2.drawImage(c, 0, 0);
  // spine sugli apici dei tubercoli: puntini chiari
  g2.globalCompositeOperation = 'source-over'; g2.globalAlpha = 1;
  for (const [cx, cy, r] of tubs) {
    for (let k = 0; k < 4; k++) {
      const a = rnd() * TAU, d = rnd() * 0.45 * r;
      g2.fillStyle = `rgba(255,246,236,${0.35 + 0.3 * rnd()})`;
      g2.beginPath(); g2.arc(cx + Math.cos(a) * d * pxU, cy + Math.sin(a) * d * pxV, 1.1, 0, TAU); g2.fill();
    }
  }
  const col = new THREE.CanvasTexture(c2);
  col.colorSpace = THREE.SRGBColorSpace;
  col.wrapS = col.wrapT = THREE.ClampToEdgeWrapping;
  col.anisotropy = bump.anisotropy;
  return { bump, col };
}
// femmina: texture ripetibile (2 mm lungo il corpo × circonferenza), papille minute e rughe trasversali
const F_UREP = 2.0;
function makeFemaleTexture() {
  const TW = 1024, TH = 256;
  const c = document.createElement('canvas'); c.width = TW; c.height = TH;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, TW, TH);
  g.globalCompositeOperation = 'lighter';
  const pxU = TW / F_UREP, pxV = TH / (TAU * 0.11);
  for (let i = 0; i < 1500; i++) {
    const x = rnd() * TW, y = rnd() * TH, r = 0.003 + 0.004 * rnd();
    for (const dx of [-TW, 0, TW]) for (const dy of [-TH, 0, TH]) {
      const X = x + dx, Y = y + dy;
      if (X < -20 || X > TW + 20 || Y < -20 || Y > TH + 20) continue;
      dome(g, X, Y, r * pxU, r * pxV, 0.3);
    }
  }
  for (let xm = 0; xm < F_UREP; xm += 0.03 + 0.03 * rnd()) {
    const x = xm * pxU;
    g.strokeStyle = `rgba(255,255,255,${0.08 + 0.1 * rnd()})`; g.lineWidth = 2 + 2 * rnd();
    g.beginPath(); g.moveTo(x, 0);
    for (let y = 0; y <= TH; y += 16) g.lineTo(x + 3 * Math.sin(TAU * y / TH * 2 + xm * 30), y);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---------------------------------------------------------------- materiali (opachi, bordi chiari come al SEM)
const maleTex = makeMaleTextures();
const femTex = makeFemaleTexture();
const maleMat = new THREE.MeshPhysicalMaterial({
  vertexColors: true, roughness: 0.62, metalness: 0,
  clearcoat: 0.18, clearcoatRoughness: 0.4,
  sheen: 1.0, sheenRoughness: 0.42, sheenColor: linRGB(255, 214, 186),
  map: maleTex.col, bumpMap: maleTex.bump, bumpScale: num('bump', 2.4),
});
const suckerMat = new THREE.MeshPhysicalMaterial({
  color: linRGB(208, 146, 110), roughness: 0.6, clearcoat: 0.18, clearcoatRoughness: 0.4,
  bumpMap: null, bumpScale: 1.0,
  sheen: 1.0, sheenRoughness: 0.42, sheenColor: linRGB(255, 214, 186),
});
const femaleMat = new THREE.MeshPhysicalMaterial({
  vertexColors: true, roughness: 0.58, metalness: 0,
  clearcoat: 0.15, clearcoatRoughness: 0.4,
  sheen: 0.8, sheenRoughness: 0.45, sheenColor: linRGB(236, 230, 222),
  bumpMap: femTex, bumpScale: num('fbump', 0.8),
});
suckerMat.bumpMap = femTex; suckerMat.bumpScale = 1.0;

// ---------------------------------------------------------------- spina (curva inestensibile, integrata dalla curvatura)
const SP = { P: new Float32Array(NM * 3), T: new Float32Array(NM * 3), N: new Float32Array(NM * 3), B: new Float32Array(NM * 3) };
const _v = new THREE.Vector3(), _w = new THREE.Vector3();

function curvature(m, t, out) {
  // k1: flessione dorso-ventrale (negativo = verso ventrale), k2: laterale, tw: torsione (1/mm)
  // il corpo si avvolge verso il lato ventrale; la torsione dà un passo d'elica che separa le estremità
  const head = Math.pow(clamp(1 - m / 0.17, 0, 1), 2);
  const K0 = 0.53 + 0.05 * Math.sin(TAU * t / 17);
  let k1 = -(1 - head) * K0 + 0.12 * Math.sin(TAU * (1.2 * m - t / 9.5))
         + head * (1.5 + 0.8 * Math.sin(TAU * t / 7.3 + 0.4));       // parte anteriore sollevata, oscilla
  let k2 = 0.1 * Math.sin(TAU * (0.8 * m + t / 12.5) + 0.7)
         + head * 1.1 * Math.sin(TAU * t / 5.9 + 1.1);
  const tw = num('tw', 0.13) + 0.03 * Math.sin(TAU * (0.6 * m - t / 15) + 0.3);
  // oltre la coda del maschio: estremità posteriore libera della femmina, si stacca dalla spirale
  const tail = smooth(0.99, 1.07, m);
  k1 = lerp(k1, 0.15 + 0.8 * Math.sin(TAU * ((m - 1) * 3.2 - t / 6.2)), tail);
  k2 += tail * (num('tk2', 0.5) + 0.9 * Math.sin(TAU * ((m - 1) * 2.6 - t / 7.4) + 0.5));
  out[0] = k1; out[1] = k2; out[2] = tw;
}

function buildSpine(t) {
  const { P, T, N, B } = SP;
  const i0 = Math.round(0.5 / M_MAX * (NM - 1));
  // orientamento lento dell'intera coppia: la spirale ruota e mostra l'interno con il canale
  const yaw = num('yaw', 0.62 + 0.33 * Math.sin(TAU * t / 23 + 0.4));
  const tilt = num('tilt', 0.3 + 0.1 * Math.sin(TAU * t / 29 + 1.3));
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt, yaw, 0, 'YXZ'));
  const t0 = new THREE.Vector3(1, 0, 0).applyQuaternion(q);
  const n0 = new THREE.Vector3(0, -1, 0).applyQuaternion(q);
  const set = (A, i, v) => { A[i * 3] = v.x; A[i * 3 + 1] = v.y; A[i * 3 + 2] = v.z; };
  const get = (A, i, v) => v.set(A[i * 3], A[i * 3 + 1], A[i * 3 + 2]);
  set(P, i0, new THREE.Vector3()); set(T, i0, t0); set(N, i0, n0); set(B, i0, _v.crossVectors(t0, n0));
  const k = [0, 0, 0];
  const Tc = new THREE.Vector3(), Nc = new THREE.Vector3(), Bc = new THREE.Vector3(), Pc = new THREE.Vector3();
  const Tn = new THREE.Vector3(), Nn = new THREE.Vector3();
  for (const dir of [1, -1]) {
    get(P, i0, Pc); get(T, i0, Tc); get(N, i0, Nc); get(B, i0, Bc);
    for (let i = i0; dir > 0 ? i < NM - 1 : i > 0; i += dir) {
      const m = (i + dir * 0.5) / (NM - 1) * M_MAX;
      curvature(m, t, k);
      const h = DS * dir;
      Tn.copy(Tc).addScaledVector(Nc, h * k[0]).addScaledVector(Bc, h * k[1]).normalize();
      Nn.copy(Nc).addScaledVector(Tn, -Nc.dot(Tn)).normalize().applyAxisAngle(Tn, h * k[2]);
      Pc.addScaledVector(_w.copy(Tc).add(Tn), 0.5 * h);
      Tc.copy(Tn); Nc.copy(Nn); Bc.crossVectors(Tc, Nc);
      const j = i + dir;
      set(P, j, Pc); set(T, j, Tc); set(N, j, Nc); set(B, j, Bc);
    }
  }
  // centro del riquadro che contiene la coppia (non il baricentro: le estremità si muovono)
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (let i = 0; i < NM; i += 2) for (let c = 0; c < 3; c++) { const v = P[i * 3 + c]; if (v < lo[c]) lo[c] = v; if (v > hi[c]) hi[c] = v; }
  const cx = (lo[0] + hi[0]) / 2, cy = (lo[1] + hi[1]) / 2, cz = (lo[2] + hi[2]) / 2;
  for (let i = 0; i < NM; i++) { P[i * 3] -= cx; P[i * 3 + 1] -= cy; P[i * 3 + 2] -= cz; }
}

const frame = { P: new THREE.Vector3(), T: new THREE.Vector3(), N: new THREE.Vector3(), B: new THREE.Vector3() };
function spineAt(m, f = frame) {
  const x = clamp(m / M_MAX, 0, 1) * (NM - 1);
  const i = Math.min(NM - 2, Math.floor(x)), a = x - i;
  const L = (A, v) => v.set(lerp(A[i * 3], A[i * 3 + 3], a), lerp(A[i * 3 + 1], A[i * 3 + 4], a), lerp(A[i * 3 + 2], A[i * 3 + 5], a));
  L(SP.P, f.P); L(SP.T, f.T).normalize(); L(SP.N, f.N).normalize(); L(SP.B, f.B).normalize();
  return f;
}

// ---------------------------------------------------------------- maschio: lamina arrotolata (sezione a C)
const KI = 16, KC = 16, KO = 64;
const K1 = 2 * (KI + 1) + 2 * KC + (KO + 1);   // punti per anello (con giunzione duplicata)
const MR = 520;                                  // anelli lungo il corpo
const vOf = new Float32Array(K1), aoOf = new Float32Array(K1);
{
  let j = 0;
  for (let q = 0; q <= KI; q++, j++) { vOf[j] = 0.15 * q / KI; aoOf[j] = 0.6 + 0.12 * q / KI; }
  for (let q = 0; q < KC; q++, j++) { vOf[j] = 0.15 + 0.05 * (q + 1) / (KC + 1); aoOf[j] = 0.75 + 0.24 * (q + 1) / (KC + 1); }
  for (let q = 0; q <= KO; q++, j++) { vOf[j] = V_OUT0 + (V_OUT1 - V_OUT0) * q / KO; aoOf[j] = 1; }
  for (let q = 0; q < KC; q++, j++) { vOf[j] = 0.8 + 0.05 * (q + 1) / (KC + 1); aoOf[j] = 0.99 - 0.24 * (q + 1) / (KC + 1); }
  for (let q = 0; q <= KI; q++, j++) { vOf[j] = 0.85 + 0.15 * q / KI; aoOf[j] = 0.72 - 0.12 * q / KI; }
}
const maleGeo = new THREE.BufferGeometry();
const mPos = new Float32Array(MR * K1 * 3), mUV = new Float32Array(MR * K1 * 2), mCol = new Float32Array(MR * K1 * 3);
{
  const idx = [];
  for (let i = 0; i < MR - 1; i++) for (let j = 0; j < K1 - 1; j++) {
    const a = i * K1 + j, b = a + 1, c = a + K1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  maleGeo.setIndex(idx);
  const base = [srgb2lin(244), srgb2lin(200), srgb2lin(166)];
  for (let i = 0; i < MR; i++) {
    const m = warp(i / (MR - 1), 0.7), can = smooth(0.085, 0.17, m);
    const tone = 0.96 + 0.05 * vnoise(m * 40);
    for (let j = 0; j < K1; j++) {
      const p = i * K1 + j;
      mUV[p * 2] = m; mUV[p * 2 + 1] = lerp(j / (K1 - 1), vOf[j], can);
      const ao = lerp(1, aoOf[j], can);
      mCol[p * 3] = base[0] * ao * tone; mCol[p * 3 + 1] = base[1] * ao * tone; mCol[p * 3 + 2] = base[2] * ao * tone;
    }
  }
  maleGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3).setUsage(THREE.DynamicDrawUsage));
  maleGeo.setAttribute('uv', new THREE.BufferAttribute(mUV, 2));
  maleGeo.setAttribute('color', new THREE.BufferAttribute(mCol, 3));
}
const maleMesh = new THREE.Mesh(maleGeo, maleMat);
maleMesh.frustumCulled = false; maleMesh.castShadow = maleMesh.receiveShadow = true; scene.add(maleMesh);

const sx = new Float32Array(K1), sy = new Float32Array(K1);
const rx = new Float32Array(K1), ry = new Float32Array(K1), cum = new Float32Array(K1);
const FORE_Y = 0.19;        // asse del collo rispetto alla spina (lato dorsale)
function maleSection(m, t) {
  // parametri della sezione: larghezza della lamina w, spessore th, angolo di arrotolamento phi.
  // Nel collo (can = 0) la lamina si riduce a un cilindro pieno.
  const can = smooth(0.085, 0.17, m);
  const phiC = PHI_MEAN + 0.28 * Math.sin(TAU * (1.7 * m + t / 13));
  let phi = phiC * can;
  const w = phiC * RHO_C * can;
  const th = lerp(0.30, TH_C, can);
  const yTop = lerp(FORE_Y, RHO_C, can);
  const thin = 0.45 * can;
  const xs = lerp(1.15, 1, can);                        // collo un po' più largo che alto
  let sc = 1 + 0.035 * can * Math.sin(TAU * (3.2 * m - t / 3.4));
  sc *= lerp(0.8, 1, smooth(0.005, 0.07, m));          // il collo si assottiglia verso la ventosa orale
  sc *= 1 - 0.14 * smooth(0.86, 0.96, m);             // coda leggermente assottigliata
  const px = 0;
  const py = m < 0.5 ? FORE_Y * (1 - smooth(0.07, 0.13, m)) : yTop * smooth(0.93, 0.96, m);
  if (m > 0.955) { const e = (m - 0.955) / 0.045; sc *= Math.sqrt(Math.max(0, 1 - e * e)); phi *= 1 - 0.3 * e; }
  const rho = phi > 1e-3 ? w / phi : 0;
  let j = 0;
  const cl = (u) => {              // linea media: punto, normale esterna, tangente
    if (phi <= 1e-3) return [u * w / 2, yTop, 0, 1, 1, 0];
    const a = u * phi / 2, s = Math.sin(a), c = Math.cos(a);
    return [rho * s, yTop + rho * (c - 1), s, c, c, -s];
  };
  const hh = (u) => th / 2 * (1 - thin * u * u);
  const put = (x, y) => { rx[j] = x * xs; ry[j] = y; j++; };
  for (let q = 0; q <= KI; q++) { const u = -q / KI; const [x, y, nx, ny] = cl(u), h = hh(u); put(x - nx * h, y - ny * h); }
  { const [x, y, nx, ny, tx, ty] = cl(-1), h = hh(-1);
    for (let q = 0; q < KC; q++) { const a = -Math.PI / 2 + Math.PI * (q + 1) / (KC + 1);
      put(x + h * (nx * Math.sin(a) - tx * Math.cos(a)), y + h * (ny * Math.sin(a) - ty * Math.cos(a))); } }
  for (let q = 0; q <= KO; q++) { const u = -1 + 2 * q / KO; const [x, y, nx, ny] = cl(u), h = hh(u); put(x + nx * h, y + ny * h); }
  { const [x, y, nx, ny, tx, ty] = cl(1), h = hh(1);
    for (let q = 0; q < KC; q++) { const a = Math.PI / 2 - Math.PI * (q + 1) / (KC + 1);
      put(x + h * (nx * Math.sin(a) + tx * Math.cos(a)), y + h * (ny * Math.sin(a) + ty * Math.cos(a))); } }
  for (let q = 0; q <= KI; q++) { const u = 1 - q / KI; const [x, y, nx, ny] = cl(u), h = hh(u); put(x - nx * h, y - ny * h); }
  // verso il collo i punti si ridistribuiscono uniformemente lungo il contorno
  if (can < 0.999) {
    cum[0] = 0;
    for (let k = 1; k < K1; k++) cum[k] = cum[k - 1] + Math.hypot(rx[k] - rx[k - 1], ry[k] - ry[k - 1]);
    const tot = cum[K1 - 1];
    let s = 0;
    for (let k = 0; k < K1; k++) {
      const target = lerp(k / (K1 - 1) * tot, cum[k], can);
      while (s < K1 - 2 && cum[s + 1] < target) s++;
      const a = clamp((target - cum[s]) / Math.max(1e-9, cum[s + 1] - cum[s]), 0, 1);
      sx[k] = lerp(rx[s], rx[s + 1], a); sy[k] = lerp(ry[s], ry[s + 1], a);
    }
  } else { sx.set(rx); sy.set(ry); }
  for (let k = 0; k < K1; k++) { sx[k] = px + (sx[k] - px) * sc; sy[k] = py + (sy[k] - py) * sc; }
}

function fixSeam(geo, rings, K) {
  const n = geo.attributes.normal.array;
  for (let i = 0; i < rings; i++) {
    const a = i * K * 3, b = (i * K + K - 1) * 3;
    let x = n[a] + n[b], y = n[a + 1] + n[b + 1], z = n[a + 2] + n[b + 2];
    const l = Math.hypot(x, y, z) || 1; x /= l; y /= l; z /= l;
    n[a] = n[b] = x; n[a + 1] = n[b + 1] = y; n[a + 2] = n[b + 2] = z;
  }
}

// ventosa orale del maschio: prosegue il collo senza stacco, si allarga appena, poi le labbra spesse
// si ripiegano verso l'interno attorno a un'apertura ovale (larga e bassa) che guarda in avanti e in basso.
// colonne: t (0 giunzione col collo → 1 fondo della cavità), z lungo l'asse (mm), raggio relativo, schiacciamento dorso-ventrale
const OS_PROFILE = makeProfile([
  [0.00, 0.000, 1.00, 1.00], [0.18, 0.050, 1.04, 1.00], [0.34, 0.098, 1.04, 0.98], [0.46, 0.135, 0.97, 0.93],
  [0.55, 0.160, 0.86, 0.86], [0.62, 0.176, 0.74, 0.78], [0.68, 0.186, 0.63, 0.70], [0.73, 0.190, 0.54, 0.62],
  [0.78, 0.186, 0.46, 0.55], [0.84, 0.170, 0.40, 0.48], [0.90, 0.140, 0.33, 0.44], [0.95, 0.110, 0.22, 0.42],
  [1.00, 0.095, 0.04, 0.42]]);
const mOf = Float32Array.from({ length: MR }, (_, i) => warp(i / (MR - 1), 0.7));
const I_OS = mOf.findIndex(m => m >= M_OS);
const frJ = { P: new THREE.Vector3(), T: new THREE.Vector3(), N: new THREE.Vector3(), B: new THREE.Vector3() };
const bx = new Float32Array(K1), by = new Float32Array(K1), prof = [0, 0, 0];
const osC = new THREE.Vector3(), osD = new THREE.Vector3(), osN = new THREE.Vector3();
function updateMale(t) {
  for (let i = I_OS; i < MR; i++) {
    const m = mOf[i];
    const f = spineAt(m);
    maleSection(m, t);
    for (let j = 0; j < K1; j++) {
      const p = (i * K1 + j) * 3, x = sx[j], y = sy[j];
      mPos[p] = f.P.x + f.B.x * x + f.N.x * y;
      mPos[p + 1] = f.P.y + f.B.y * x + f.N.y * y;
      mPos[p + 2] = f.P.z + f.B.z * x + f.N.z * y;
    }
  }
  // ventosa orale: anelli costruiti lungo un asse che parte dal collo e piega verso il lato ventrale
  const fj = spineAt(M_OS, frJ);
  maleSection(M_OS, t);
  for (let k = 0; k < K1; k++) { bx[k] = sx[k]; by[k] = sy[k] - FORE_Y; }
  osC.copy(fj.P).addScaledVector(fj.N, FORE_Y);
  const pulse = Math.sin(TAU * t / 2.3);
  let zPrev = 0;
  for (let i = I_OS - 1; i >= 0; i--) {
    const tau = 1 - mOf[i] / M_OS;
    OS_PROFILE(tau, prof);
    const open = smooth(0.55, 0.75, tau);
    const rs = prof[1] * (1 + 0.07 * pulse * open), ay = prof[2] * (1 + 0.2 * pulse * open);
    const al = 0.5 * smooth(0.05, 0.5, tau);
    osD.copy(fj.T).multiplyScalar(-Math.cos(al)).addScaledVector(fj.N, -Math.sin(al));
    osC.addScaledVector(osD, prof[0] - zPrev); zPrev = prof[0];
    osN.crossVectors(osD, fj.B).normalize();
    for (let k = 0; k < K1; k++) {
      const p = (i * K1 + k) * 3, x = bx[k] * rs, y = by[k] * rs * ay;
      mPos[p] = osC.x + fj.B.x * x + osN.x * y;
      mPos[p + 1] = osC.y + fj.B.y * x + osN.y * y;
      mPos[p + 2] = osC.z + fj.B.z * x + osN.z * y;
    }
  }
  maleGeo.attributes.position.needsUpdate = true;
  maleGeo.computeVertexNormals();
  fixSeam(maleGeo, MR, K1);
}

// ---------------------------------------------------------------- ventose (solidi di rivoluzione con pieghe)
// profilo [r, y, tipo]: 0 parete esterna, 1 bordo, 2 coppa interna; y lungo l'asse, apertura verso +y
function makeLathe(pts, segs, disp) {
  const n = pts.length, pos = [], idx = [], uv = [];
  for (let j = 0; j <= segs; j++) {
    const th = j / segs * TAU, c = Math.cos(th), s = Math.sin(th);
    for (let i = 0; i < n; i++) {
      let [r, y, kind] = pts[i];
      if (disp) { const d = disp(i, th, r, y, kind); r += d[0]; y += d[1]; }
      pos.push(r * s, y, r * c);
      uv.push(j / segs * 6, i / (n - 1));
    }
  }
  for (let j = 0; j < segs; j++) for (let i = 0; i < n - 1; i++) {
    const a = j * n + i, b = a + n, c = b + 1, d = a + 1;
    idx.push(a, b, d, c, d, b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const nr = g.attributes.normal.array;
  for (let i = 0; i < n; i++) {
    const a = i * 3, b = (segs * n + i) * 3;
    for (let k = 0; k < 3; k++) { const v = (nr[a + k] + nr[b + k]) / 2; nr[a + k] = nr[b + k] = v; }
  }
  return g;
}
// profilo denso: interpolazione lineare fra punti di controllo
function densify(ctrl, per) {
  const out = [];
  for (let i = 0; i < ctrl.length - 1; i++) {
    const [r0, y0, k0] = ctrl[i], [r1, y1] = ctrl[i + 1];
    for (let s = 0; s < per; s++) { const a = s / per; out.push([lerp(r0, r1, a), lerp(y0, y1, a), k0]); }
  }
  out.push(ctrl[ctrl.length - 1]);
  return out;
}
// ventosa ventrale del maschio: disco su breve peduncolo, bordo spesso, pieghe radiali verso il centro
const ventralGeo = makeLathe(densify([
  [0.001, -0.07, 0], [0.1, -0.065, 0], [0.104, 0.0, 0], [0.112, 0.05, 0], [0.14, 0.085, 0], [0.172, 0.115, 0],
  [0.188, 0.145, 1], [0.184, 0.172, 1], [0.168, 0.19, 1], [0.142, 0.193, 1], [0.12, 0.185, 2], [0.1, 0.168, 2],
  [0.075, 0.15, 2], [0.05, 0.138, 2], [0.025, 0.131, 2], [0.001, 0.129, 2]], 3), 80,
  (i, th, r, y, kind) => kind === 1 ? [0.0022 * Math.sin(th * 7 + 0.6) + 0.0012 * Math.sin(th * 31), 0.0015 * Math.sin(th * 7 + 0.6)]
                      : kind === 2 ? [0, 0.009 * Math.sin(th * 11) * smooth(0.0, 0.05, r) * smooth(0.13, 0.08, r)] : [0, 0]);
const ventral = new THREE.Mesh(ventralGeo, suckerMat);
ventral.castShadow = ventral.receiveShadow = true; scene.add(ventral);

const _m4 = new THREE.Matrix4(), _X = new THREE.Vector3(), _Y = new THREE.Vector3(), _Z = new THREE.Vector3();
// orienta un solido di rivoluzione: asse y lungo 'axis', asse x verso 'side'
function orient(mesh, pos, axis, side, sx = 1, sy = 1, sz = 1) {
  _Y.copy(axis).normalize();
  _X.copy(side).addScaledVector(_Y, -side.dot(_Y)).normalize();
  _Z.crossVectors(_X, _Y);
  _m4.makeBasis(_X, _Y, _Z);
  mesh.quaternion.setFromRotationMatrix(_m4);
  mesh.position.copy(pos);
  mesh.scale.set(sx, sy, sz);
}
const _pos = new THREE.Vector3(), _axis = new THREE.Vector3();
function placeMaleSuckers(t) {
  // ventrale: disco sul lato ventrale del collo, aperto in basso e leggermente in avanti
  const f = spineAt(M_VS);
  const pv = Math.sin(TAU * t / 3.7 + 1);
  _axis.copy(f.N).multiplyScalar(-Math.cos(0.35)).addScaledVector(f.T, -Math.sin(0.35));
  _pos.copy(f.P).addScaledVector(f.N, 0.07);
  orient(ventral, _pos, _axis, f.B, 1 + 0.05 * pv, 1 - 0.05 * pv, 1 + 0.05 * pv);
}

// ---------------------------------------------------------------- femmina: tubo con profilo di raggio
const FR = 420, FS = 40, FK = FS + 1;
const M_FB = M_MAX - 0.004;
const L_F = LH + (M_FB - M_EXIT) * L_M;
const F_NT = 30;            // anelli dedicati alla ventosa orale
const fSig = Float32Array.from({ length: FR }, (_, i) => i < F_NT ? S_OS * i / F_NT
  : S_OS + warp((i - F_NT) / (FR - 1 - F_NT)) * (L_F - S_OS));
const femaleGeo = new THREE.BufferGeometry();
const fPos = new Float32Array(FR * FK * 3), fCol = new Float32Array(FR * FK * 3), fBase = new Float32Array(FR * FK * 3);
const fUV = new Float32Array(FR * FK * 2);
{
  const idx = [];
  for (let i = 0; i < FR - 1; i++) for (let j = 0; j < FS; j++) {
    const a = i * FK + j, b = a + 1, c = a + FK, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  femaleGeo.setIndex(idx);
  const pale = [srgb2lin(222), srgb2lin(210), srgb2lin(194)];
  const dark = [srgb2lin(196), srgb2lin(180), srgb2lin(160)];
  for (let i = 0; i < FR; i++) {
    const sg = fSig[i];
    for (let j = 0; j < FK; j++) {
      const th = j / FS * TAU;
      const mott = 0.6 * vnoise(sg * 9 + 13 * Math.cos(th) + 50) + 0.4 * vnoise(sg * 23 + 7 * Math.sin(th) + 300);
      const d = clamp((0.2 + 0.45 * smooth(2.4, 6, sg)) * (0.5 + 0.7 * mott), 0, 1);
      const p = (i * FK + j) * 3;
      for (let c = 0; c < 3; c++) fBase[p + c] = lerp(pale[c], dark[c], d);
      fUV[(i * FK + j) * 2] = sg / F_UREP; fUV[(i * FK + j) * 2 + 1] = j / FS;
    }
  }
  femaleGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3).setUsage(THREE.DynamicDrawUsage));
  femaleGeo.setAttribute('color', new THREE.BufferAttribute(fCol, 3).setUsage(THREE.DynamicDrawUsage));
  femaleGeo.setAttribute('uv', new THREE.BufferAttribute(fUV, 2));
}
const femaleMesh = new THREE.Mesh(femaleGeo, femaleMat);
femaleMesh.frustumCulled = false; femaleMesh.castShadow = femaleMesh.receiveShadow = true; scene.add(femaleMesh);

function femaleRadius(sg, t, free) {
  let r = 0.027 + 0.05 * smooth(0.03, 0.95, sg) + 0.043 * smooth(0.5, 3.8, sg);   // parte anteriore affusolata
  r *= 1 - 0.32 * smooth(L_F - 1.3, L_F, sg);
  const a = clamp(sg / 0.035, 0, 1), b = clamp((L_F - sg) / 0.14, 0, 1);
  r *= Math.sqrt(a * (2 - a)) * Math.sqrt(b * (2 - b));
  r *= 1 + 0.06 * free * Math.sin(TAU * (sg * 1.25 - t / 2.9));
  return r;
}

// parte anteriore libera: curva integrata dall'apertura del canale, esce dal lato ventrale verso il centro della spirale
const NH = 160, hP = new Float32Array(NH * 3), hN = new Float32Array(NH * 3);
function buildFemaleHead(t) {
  const f = spineAt(M_EXIT);
  const P = f.P.clone().addScaledVector(f.N, -0.02);
  const T = f.T.clone().negate(), N = f.N.clone(), B = new THREE.Vector3().crossVectors(T, N);
  const Tn = new THREE.Vector3(), ds = LH / (NH - 1);
  const store = (k) => { hP[k * 3] = P.x; hP[k * 3 + 1] = P.y; hP[k * 3 + 2] = P.z; hN[k * 3] = N.x; hN[k * 3 + 1] = N.y; hN[k * 3 + 2] = N.z; };
  store(0);
  for (let k = 1; k < NH; k++) {
    const s = (k - 0.5) * ds;
    const ex = 1 - smooth(0, 0.55, s), fr = smooth(0.3, 0.9, s);
    const k1 = num('hk1', -3.2) * ex + 1.5 * fr * Math.sin(TAU * (s / 1.0 - t / 5.7));
    const k2 = num('hk2', 1.8) * ex + 1.9 * fr * Math.sin(TAU * (s / 0.85 - t / 4.6) + 1.2);
    Tn.copy(T).addScaledVector(N, ds * k1).addScaledVector(B, ds * k2).normalize();
    N.addScaledVector(Tn, -N.dot(Tn)).normalize();
    P.addScaledVector(_w.copy(T).add(Tn), 0.5 * ds);
    T.copy(Tn); B.crossVectors(T, N);
    store(k);
  }
}

const fc = new Float32Array(FR * 3), fN = new Float32Array(FR * 3), fCov = new Float32Array(FR), fR = new Float32Array(FR);
const fT = new Float32Array(FR * 3);
// ventosa orale della femmina: piccola coppa terminale con labbro (t: 0 giunzione → 1 fondo; z, raggio relativo, schiacciamento)
const FOS_PROFILE = makeProfile([
  [0.00, 0.000, 1.00, 1.00], [0.30, 0.022, 0.97, 1.00], [0.50, 0.036, 0.82, 0.98], [0.62, 0.044, 0.62, 0.96],
  [0.72, 0.049, 0.40, 0.94], [0.80, 0.051, 0.22, 0.92], [0.86, 0.0515, 0.14, 0.9], [0.92, 0.049, 0.09, 0.9],
  [1.00, 0.044, 0.02, 0.9]]);
const I_FJ = F_NT;          // primo anello del corpo dopo la ventosa orale
const S_FVS = 0.3;          // ventosa ventrale della femmina: distanza dalla punta (mm)
function updateFemale(t) {
  buildFemaleHead(t);
  for (let i = 0; i < FR; i++) {
    const sg = fSig[i];
    if (sg < LH) {
      const x = (LH - sg) / LH * (NH - 1), k = Math.min(NH - 2, Math.floor(x)), a = x - k;
      for (let c = 0; c < 3; c++) {
        fc[i * 3 + c] = lerp(hP[k * 3 + c], hP[k * 3 + 3 + c], a);
        fN[i * 3 + c] = lerp(hN[k * 3 + c], hN[k * 3 + 3 + c], a);
      }
      fCov[i] = 0;
    } else {
      const m = M_EXIT + (sg - LH) / L_M;
      const f = spineAt(m);
      const offN = -0.02 - 0.16 * smooth(0.95, 1.03, m);  // esce sotto la coda del maschio
      fc[i * 3] = f.P.x + f.N.x * offN; fc[i * 3 + 1] = f.P.y + f.N.y * offN; fc[i * 3 + 2] = f.P.z + f.N.z * offN;
      fN[i * 3] = f.N.x; fN[i * 3 + 1] = f.N.y; fN[i * 3 + 2] = f.N.z;
      fCov[i] = smooth(M_EXIT + 0.01, M_EXIT + 0.13, m) * smooth(0.985, 0.93, m);
    }
  }
  const T = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3(), d = new THREE.Vector3(), gap = new THREE.Vector3();
  // giunzione con la ventosa orale: asse e sistema di riferimento degli anelli della punta
  const TJ = new THREE.Vector3(fc[I_FJ * 3 + 3] - fc[I_FJ * 3 - 3], fc[I_FJ * 3 + 4] - fc[I_FJ * 3 - 2], fc[I_FJ * 3 + 5] - fc[I_FJ * 3 - 1]).normalize();
  const NJ = new THREE.Vector3(fN[I_FJ * 3], fN[I_FJ * 3 + 1], fN[I_FJ * 3 + 2]); NJ.addScaledVector(TJ, -NJ.dot(TJ)).normalize();
  const CJ = new THREE.Vector3(fc[I_FJ * 3], fc[I_FJ * 3 + 1], fc[I_FJ * 3 + 2]);
  const rJ = femaleRadius(S_OS, t, 1);
  const fpulse = Math.sin(TAU * t / 1.9 + 0.7);
  for (let i = 0; i < FR; i++) {
    let r, ay = 1;
    if (i < I_FJ) {
      const tau = 1 - i / F_NT;
      FOS_PROFILE(tau, prof);
      fc[i * 3] = CJ.x - TJ.x * prof[0]; fc[i * 3 + 1] = CJ.y - TJ.y * prof[0]; fc[i * 3 + 2] = CJ.z - TJ.z * prof[0];
      T.copy(TJ); N.copy(NJ);
      const open = smooth(0.55, 0.8, tau);
      r = rJ * prof[1] * (1 + 0.08 * fpulse * open); ay = prof[2];
    } else {
      const a = Math.max(I_FJ, i - 1), b = Math.min(FR - 1, i + 1);
      T.set(fc[b * 3] - fc[a * 3], fc[b * 3 + 1] - fc[a * 3 + 1], fc[b * 3 + 2] - fc[a * 3 + 2]).normalize();
      N.set(fN[i * 3], fN[i * 3 + 1], fN[i * 3 + 2]); N.addScaledVector(T, -N.dot(T)).normalize();
      r = femaleRadius(fSig[i], t, 1 - fCov[i]);
    }
    B.crossVectors(T, N);
    fT[i * 3] = T.x; fT[i * 3 + 1] = T.y; fT[i * 3 + 2] = T.z;
    fN[i * 3] = N.x; fN[i * 3 + 1] = N.y; fN[i * 3 + 2] = N.z;
    gap.copy(N).negate();                               // apertura del canale: lato ventrale del maschio
    const sg = fSig[i];
    fR[i] = r;
    for (let j = 0; j < FK; j++) {
      const th = j / FS * TAU;
      // ventosa ventrale: piccolo disco a fessura trasversale sul lato ventrale, a S_FVS dalla punta
      let rr = r;
      if (sg > S_FVS - 0.06 && sg < S_FVS + 0.06) {
        let dth = th - Math.PI; dth -= TAU * Math.round(dth / TAU);
        const du = sg - S_FVS, dv = dth * r, rho = Math.hypot(du, dv);
        rr += 0.006 * Math.exp(-(((rho - 0.015) / 0.0065) ** 2)) - 0.005 * Math.exp(-((Math.hypot(du * 1.5, dv * 0.8) / 0.009) ** 2));
      }
      d.copy(N).multiplyScalar(Math.cos(th) * ay).addScaledVector(B, Math.sin(th));
      const p = (i * FK + j) * 3;
      fPos[p] = fc[i * 3] + d.x * rr; fPos[p + 1] = fc[i * 3 + 1] + d.y * rr; fPos[p + 2] = fc[i * 3 + 2] + d.z * rr;
      // dentro il canale arriva poca luce: in luce soprattutto la parte che guarda l'apertura
      const face = d.dot(gap);
      const ao = lerp(1, lerp(0.5, 1.0, smooth(-0.35, 0.75, face)), fCov[i]);
      fCol[p] = fBase[p] * ao; fCol[p + 1] = fBase[p + 1] * ao; fCol[p + 2] = fBase[p + 2] * ao;
    }
  }
  femaleGeo.attributes.position.needsUpdate = true;
  femaleGeo.attributes.color.needsUpdate = true;
  femaleGeo.computeVertexNormals();
  fixSeam(femaleGeo, FR, FK);
}

// ---------------------------------------------------------------- camera
const controls = CAPTURE ? null : new OrbitControls(camera, renderer.domElement);
let userDriven = false;
if (controls) {
  controls.enableDamping = true; controls.minDistance = 2; controls.maxDistance = 40; controls.enablePan = false;
  controls.addEventListener('start', () => { userDriven = true; document.getElementById('hint').hidden = true; });
}
const DIST = num('dist', 10.2);
function autoCamera(t) {
  const az = num('az', 0.16 * Math.sin(TAU * t / 41) + 0.04);
  const el = num('el', 0.2 + 0.06 * Math.sin(TAU * t / 33 + 1.0));
  camera.position.set(DIST * Math.sin(az) * Math.cos(el), DIST * Math.sin(el), DIST * Math.cos(az) * Math.cos(el));
  if (params.has('fm')) { const f = spineAt(num('fm', 0)); camera.position.add(f.P); camera.lookAt(f.P); }
  else if (params.has('ff')) {
    const i = Math.max(0, fSig.findIndex(x => x >= num('ff', 0)));
    const c = new THREE.Vector3(fc[i * 3], fc[i * 3 + 1], fc[i * 3 + 2]);
    camera.position.add(c); camera.lookAt(c);
  }
  else camera.lookAt(0, 0, 0);
}
function syncRig() {
  // le softbox seguono la camera, come in uno studio dove si gira attorno al soggetto
  _v.copy(camera.position); rig.rotation.y = Math.atan2(_v.x, _v.z);
}

// ---------------------------------------------------------------- post: occlusione ambientale (GTAO)
const AO = num('ao', 1) > 0;
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: CAPTURE ? 0 : 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.updateGtaoMaterial({ radius: num('aor', 0.32), distanceExponent: 1.6, thickness: 0.6, scale: num('aos', 1.1),
  samples: 16, distanceFallOff: 1.0, screenSpaceRadius: false });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
gtao.blendIntensity = num('aob', 0.9);
gtao.enabled = AO;
composer.addPass(gtao);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- dimensioni / HUD
const bar = document.getElementById('bar');
function resize() {
  const w = CAPTURE ? W0 : window.innerWidth, h = CAPTURE ? H0 : window.innerHeight;
  renderer.setSize(w, h, !CAPTURE);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h;
  // su schermi stretti allarga il campo per tenere tutta la coppia in vista
  camera.fov = w / h < 1 ? 27 * Math.min(1.9, 1.1 / (w / h)) : 27;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
function updateBar() {
  const d = camera.position.length();
  const pxPerMm = window.innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * d);
  bar.style.width = Math.round(pxPerMm) + 'px';
}

// ---------------------------------------------------------------- ciclo
function renderAt(t) {
  buildSpine(t);
  updateMale(t);
  updateFemale(t);
  placeMaleSuckers(t);
  if (!userDriven) autoCamera(t);
  syncRig();
  renderer.shadowMap.needsUpdate = SHADOWS;
  composer.render();
}
if (params.has('wire')) femaleMat.wireframe = true;
if (params.has('nomale')) { maleMesh.visible = false; ventral.visible = false; }
window.__renderAt = (t) => { renderAt(t); return true; };
if (params.has('debug')) window.__tip = (t) => {
  buildSpine(t); updateFemale(t);
  const C = new THREE.Vector3(fc[I_FJ * 3], fc[I_FJ * 3 + 1], fc[I_FJ * 3 + 2]);
  const T = new THREE.Vector3(fT[I_FJ * 3], fT[I_FJ * 3 + 1], fT[I_FJ * 3 + 2]);
  const out = [];
  for (let i = 0; i < I_FJ + 6; i++) {
    const c = new THREE.Vector3(fc[i * 3], fc[i * 3 + 1], fc[i * 3 + 2]);
    const rad = Array.from({ length: FK }, (_, j) => j).map(j => { const p = (i * FK + j) * 3; return +Math.hypot(fPos[p] - fc[i * 3], fPos[p + 1] - fc[i * 3 + 1], fPos[p + 2] - fc[i * 3 + 2]).toFixed(4); });
    const ax = [0, 10, 20, 30].map(j => { const p = (i * FK + j) * 3; return +(-(new THREE.Vector3(fPos[p], fPos[p + 1], fPos[p + 2]).sub(C).dot(T))).toFixed(4); });
    const n = new THREE.Vector3(fc[i * 3 + 3], fc[i * 3 + 4], fc[i * 3 + 5]);
    out.push([i, rad.map(v => Math.round(v * 1e4)).join(" ")]);
  }
  return out;
};
// verifica delle compenetrazioni (solo con ?debug): distanza minima fra superfici approssimate da sfere
if (params.has('debug')) window.__clearance = (t) => {
  buildSpine(t); updateFemale(t);
  const male = [];
  for (let k = 0; k <= 200; k++) {
    const m = k / 200, f = spineAt(m);
    if (m < 0.13) male.push([f.P.clone().addScaledVector(f.N, 0.19), 0.17, m]);
    else male.push([f.P.clone(), 0.345 * (1 - 0.14 * smooth(0.86, 0.96, m)), m]);
  }
  let f = spineAt(M_VS); male.push([f.P.clone().addScaledVector(f.N, -0.08), 0.19, M_VS]);
  f = spineAt(M_OS); male.push([f.P.clone().addScaledVector(f.N, FORE_Y).addScaledVector(f.T, -0.09), 0.17, 0]);
  const out = { headFem: 9, tailFem: 9, maleSelf: 9, femSelf: 9 };
  const fpt = (i) => new THREE.Vector3(fc[i * 3], fc[i * 3 + 1], fc[i * 3 + 2]);
  for (let i = 0; i < FR; i += 2) {
    const sg = fSig[i], m = M_EXIT + (sg - LH) / L_M;
    const isHead = sg < LH - 0.55, isTail = m > 1.07;
    if (!isHead && !isTail) continue;
    const p = fpt(i);
    for (const [c, R, mm] of male) {
      if (isHead && mm > 0.1 && mm < 0.26) continue;    // vicino all'apertura del canale da cui esce
      if (isTail && mm > 0.95) continue;                // vicino alla coda del maschio da cui esce
      const d = p.distanceTo(c) - R - fR[i];
      if (isHead) out.headFem = Math.min(out.headFem, d); else out.tailFem = Math.min(out.tailFem, d);
    }
    if (isTail) for (let j = 0; j < FR; j += 2) if (fSig[j] < LH - 0.25) {
      out.femSelf = Math.min(out.femSelf, p.distanceTo(fpt(j)) - fR[i] - fR[j]);
    }
  }
  for (const [c1, R1, m1] of male) for (const [c2, R2, m2] of male) if (m1 < 0.25 && m2 > 0.75) out.maleSelf = Math.min(out.maleSelf, c1.distanceTo(c2) - R1 - R2);
  return out;
};
window.__ready = true;

if (!CAPTURE) {
  let t = num('t', 0), last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!REDUCED && !document.hidden) t += dt;
    if (controls && userDriven) controls.update();
    renderAt(t);
    updateBar();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
